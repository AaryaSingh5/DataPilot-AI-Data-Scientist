[project]
name = "datapilot"
version = "0.1.0"
description = "Autonomous, multi-agent AI data scientist."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.34.2",
    "duckdb>=1.1.0",
    "fastexcel>=0.11.1",
    "kaleido>=0.2.1",
    "langgraph>=0.2.20",
    "networkx>=3.3",
    "openpyxl>=3.1.5",
    "pandas>=2.2.2",
    "pingouin>=0.5.4",
    "plotly>=5.24.0",
    "polars>=1.6.0",
    "psycopg[binary]>=3.2.1",
    "pyarrow>=17.0.0",
    "pydantic>=2.9.1",
    "pyyaml>=6.0.2",
    "scikit-learn>=1.5.2",
    "scipy>=1.14.1",
    "shap>=0.46.0",
    "sqlglot>=25.18.0",
    "statsmodels>=0.14.3",
    "streamlit>=1.38.0",
    "streamlit-plotly-events>=0.0.6",
    "structlog>=24.4.0",
    "typer>=0.12.5",
    "weasyprint>=62.3",
    "pyvis>=0.3.2"
]

[project.scripts]
datapilot = "datapilot.cli:app"

[project.optional-dependencies]
dev = [
    "pytest>=8.3.3",
    "pytest-cov>=5.0.0",
    "hypothesis>=6.112.0",
    "ruff>=0.6.5",
    "mypy>=1.11.2",
    "pre-commit>=3.8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/datapilot"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
